name: Java CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
          - os: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Grant execute permission for Gradle wrapper
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Test and validate both Maven publications
        shell: bash
        run: |
          ./gradlew test \
            :core:publishMavenJavaPublicationToLocalReleaseRepository \
            :ui:publishMavenJavaPublicationToLocalReleaseRepository \
            -PpublicationGroup=io.github.ghosthack -PforkVersion=3.76-ghosthack.2 \
            --no-daemon --stacktrace
          python3 scripts/verify-release.py 3.76-ghosthack.2
