name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.release.prerelease == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+)*-ghosthack\.[0-9]+$ ]]; then
            echo "::error::Expected a fork release tag such as v3.76-ghosthack.2"
            exit 1
          fi
          echo "FORK_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Build, test and stage both modules locally
        shell: bash
        run: |
          ./gradlew :core:test :ui:test \
            :core:publishMavenJavaPublicationToLocalReleaseRepository \
            :ui:publishMavenJavaPublicationToLocalReleaseRepository \
            -PpublicationGroup=io.github.ghosthack -PforkVersion="$FORK_VERSION" --no-daemon
          python3 scripts/verify-release.py "$FORK_VERSION"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Stage and verify signed release artifacts
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          FORK_VERSION="${RELEASE_TAG#v}"
          ./gradlew :core:test :ui:test \
            :core:publishMavenJavaPublicationToLocalReleaseRepository \
            :ui:publishMavenJavaPublicationToLocalReleaseRepository \
            -PpublicationGroup=io.github.ghosthack -PforkVersion="$FORK_VERSION" \
            -PrequireSigning=true --no-daemon
          python3 scripts/verify-release.py "$FORK_VERSION" --require-signatures
      - name: Publish both modules to Maven Central
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository \
            -PpublicationGroup=io.github.ghosthack -PforkVersion="${RELEASE_TAG#v}" \
            -PrequireSigning=true --no-daemon
